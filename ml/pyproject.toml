[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis_ml"
version = "0.1.0"
description = "AegisFlow ML Feature Engine, XGBoost/LightGBM Training, Calibration & Drift Package"
authors = [{ name = "AegisFlow Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "mlflow>=2.10",
    "pyarrow>=14.0",
    "networkx>=3.0"
]
