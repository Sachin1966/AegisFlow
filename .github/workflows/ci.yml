name: AegisFlow CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis_user
          POSTGRES_PASSWORD: aegis_password_secure
          POSTGRES_DB: aegisflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov alembic sqlalchemy pydantic redis pandas numpy xgboost lightgbm shap networkx
          pip install -e ./generator
          pip install -e ./ml

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql://aegis_user:aegis_password_secure@localhost:5432/aegisflow_db
        run: |
          alembic -c db/alembic.ini upgrade head

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://aegis_user:aegis_password_secure@localhost:5432/aegisflow_db
        run: |
          python db/seed/seed.py

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql://aegis_user:aegis_password_secure@localhost:5432/aegisflow_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/unit tests/integration -v --cov=generator --cov=ml
